version: "3.8"

# Production stack. Uses an .env file at the repo root for secrets.
# Copy backend/.env.example to .env, fill in all CHANGE_ME values, then run:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  # ── Nginx reverse-proxy (only publicly exposed service) ─────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ssssy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── Spring Boot backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-ssssy/ssssy}/backend:${IMAGE_TAG:-latest}
    container_name: ssssy-backend
    restart: unless-stopped
    # Do NOT expose port 8080 to the host — only nginx talks to the backend.
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ssssy_website
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-ssssy}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      APP_STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      APP_STORAGE_MINIO_ENDPOINT: http://minio:9000
      APP_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      APP_STORAGE_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      APP_STORAGE_MINIO_BUCKET: ${MINIO_BUCKET:-ssssy-media}
      # JWT_SECRET is the correct env var name read by application.yml
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-https://ssssyria.org}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://ssssyria.org,https://www.ssssyria.org}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_SWAGGER_ENABLED: ${APP_SWAGGER_ENABLED:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.18.0.0/16}
      SPRING_MAIL_HOST: ${SMTP_HOST}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
      SPRING_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_SMTP_STARTTLS: "true"
      SSSSY_EMAIL_IMAP_HOST: ${IMAP_HOST:-localhost}
      SSSSY_EMAIL_IMAP_PORT: ${IMAP_PORT:-143}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      LOGGING_LEVEL_ORG_SSSSY: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Next.js frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ssssyria.org/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ssssyria.org}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SSSSY}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-https://ssssyria.org/storage}
    image: ghcr.io/${GITHUB_REPOSITORY:-ssssy/ssssy}/frontend:${IMAGE_TAG:-latest}
    container_name: ssssy-frontend
    restart: unless-stopped
    # Internal only — nginx is the public entry point
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Runtime env vars for server-side Next.js code (non-NEXT_PUBLIC_*)
      API_URL: http://backend:8080/api
    depends_on:
      - backend

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ssssy-postgres
    restart: unless-stopped
    # Internal only — do not expose 5432 to the host in production
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ssssy_website
      POSTGRES_USER: ${DB_USER:-ssssy}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ssssy} -d ssssy_website"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO object storage ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ssssy-minio
    restart: unless-stopped
    # Expose console on 9001 to host for admin access (firewall this in production)
    ports:
      - "127.0.0.1:9001:9001"
    expose:
      - "9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ssssy-redis
    restart: unless-stopped
    expose:
      - "6379"
    # Require password if REDIS_PASSWORD is set
    command: >
      sh -c "if [ -n '${REDIS_PASSWORD:-}' ]; then
               redis-server --requirepass ${REDIS_PASSWORD};
             else
               redis-server;
             fi"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Certbot (Let's Encrypt certificate renewal) ───────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: ssssy-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Run once manually with:
    #   docker compose -f docker-compose.prod.yml run --rm certbot certonly \
    #     --webroot -w /var/www/certbot -d ssssyria.org -d www.ssssyria.org \
    #     --email admin@ssssyria.org --agree-tos --no-eff-email
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  minio_data:
  redis_data:
  backend_uploads:
  backend_logs:
  nginx_logs:
  letsencrypt:
  certbot_www:

networks:
  default:
    name: ssssy-network
