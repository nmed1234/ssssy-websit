worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;       # Do not expose nginx version

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_static       on;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # ── Upload size limit (must match Spring multipart config: 25 MB) ────────
    client_max_body_size 30M;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    # Auth endpoints: 5 req/min per IP
    limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=5r/m;
    # API general: 120 req/min per IP
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=120r/m;
    # Static assets: 300 req/min
    limit_req_zone  $binary_remote_addr  zone=static:10m   rate=300r/m;

    # ── Upstream services ────────────────────────────────────────────────────
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge for Let's Encrypt (certbot webroot mode)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ssssyria.org www.ssssyria.org;

        # ── TLS ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/ssssyria.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ssssyria.org/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers (nginx layer — Next.js also sets these) ─────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ── Public API — short shared cache (GET only) ────────────────────────
        location ~ ^/api/public/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            # Cache-Control for public GET endpoints: 30 s fresh, serve stale for 60 s while revalidating
            add_header         Cache-Control "public, max-age=30, stale-while-revalidate=60" always;
            add_header         Vary "Accept-Encoding" always;
        }

        # ── Backend API proxy (all other API paths) ──────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── Auth endpoints (tighter rate limit) ──────────────────────────────
        location ~ ^/api/auth/(login|register|forgot-password) {
            limit_req zone=auth burst=2 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── WebSocket (STOMP over SockJS) ────────────────────────────────────
        location /ws {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── MinIO storage proxy (public read-only) ───────────────────────────
        location /storage/ {
            limit_req zone=static burst=50 nodelay;

            proxy_pass         http://minio:9000/ssssy-media/;
            proxy_set_header   Host              minio:9000;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_hide_header  X-Amz-Request-Id;
            proxy_hide_header  X-Amz-Id-2;

            # Cache media files for 7 days
            proxy_cache_valid  200 7d;
            add_header         Cache-Control "public, max-age=604800, immutable";
        }

        # ── Actuator health (public, other actuator paths blocked) ───────────
        location = /actuator/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /actuator/ {
            return 403;
        }

        # ── Next.js immutable static assets (content-hashed filenames) ────────
        location /_next/static/ {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        "";
            # Hash-named files are immutable — cache for 1 year in browsers and CDNs.
            add_header         Cache-Control "public, max-age=31536000, immutable" always;
            add_header         Vary "Accept-Encoding" always;
        }

        # ── Next.js image optimization endpoint ──────────────────────────────
        location /_next/image {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        "";
            # Let Next.js image optimizer set its own Cache-Control; just pass it through.
        }

        # ── Frontend (Next.js) — HTML pages ───────────────────────────────────
        location / {
            limit_req zone=static burst=60 nodelay;

            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            # HTML pages must revalidate — ISR sets ETags; no-cache forces revalidation.
            add_header         Cache-Control "no-cache" always;
        }
    }
}
